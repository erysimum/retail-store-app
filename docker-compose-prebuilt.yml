## docker-compose-prebuilt.yml
## Uses pre-built AWS ECR public images (no local build needed)
## Run: docker compose -f docker-compose-prebuilt.yml up

services:
  # ─── DATABASES ───────────────────────────────────────
  catalog-db:
    image: mariadb:10.9
    hostname: catalog-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=devpassword123
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=catalogdb
      - MYSQL_USER=catalog_user
      - MYSQL_PASSWORD=devpassword123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  orders-db:
    image: postgres:16.1
    hostname: orders-db
    restart: always
    environment:
      - POSTGRES_PASSWORD=devpassword123
      - POSTGRES_DB=orders
      - POSTGRES_USER=orders_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d orders -U orders_user"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  carts-db:
    image: amazon/dynamodb-local:1.20.0
    hostname: carts-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 5s
      timeout: 5s
      retries: 3

  checkout-redis:
    image: redis:6.0-alpine
    hostname: checkout-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=rabbitmq
      - RABBITMQ_DEFAULT_PASS=devpassword123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── APPLICATION SERVICES ────────────────────────────
  catalog:
    image: public.ecr.aws/aws-containers/retail-store-sample-catalog:0.8.3
    hostname: catalog
    restart: always
    environment:
      - GIN_MODE=release
      - RETAIL_CATALOG_PERSISTENCE_PROVIDER=mysql
      - RETAIL_CATALOG_PERSISTENCE_ENDPOINT=catalog-db:3306
      - RETAIL_CATALOG_PERSISTENCE_PASSWORD=devpassword123
    ports:
      - "8081:8080"
    depends_on:
      catalog-db:
        condition: service_healthy

  cart:
    image: public.ecr.aws/aws-containers/retail-store-sample-cart:0.8.3
    hostname: carts
    restart: always
    environment:
      - RETAIL_CART_PERSISTENCE_PROVIDER=dynamodb
      - RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT=http://carts-db:8000
      - RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE=true
      - AWS_ACCESS_KEY_ID=key
      - AWS_SECRET_ACCESS_KEY=dummy
    ports:
      - "8082:8080"
    depends_on:
      carts-db:
        condition: service_healthy

  orders:
    image: public.ecr.aws/aws-containers/retail-store-sample-orders:0.8.3
    hostname: orders
    restart: always
    environment:
      - RETAIL_ORDERS_PERSISTENCE_PROVIDER=postgres
      - RETAIL_ORDERS_PERSISTENCE_ENDPOINT=orders-db:5432
      - RETAIL_ORDERS_PERSISTENCE_NAME=orders
      - RETAIL_ORDERS_PERSISTENCE_USERNAME=orders_user
      - RETAIL_ORDERS_PERSISTENCE_PASSWORD=devpassword123
      - RETAIL_ORDERS_MESSAGING_PROVIDER=rabbitmq
      - RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES=rabbitmq:5672
      - RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME=rabbitmq
      - RETAIL_ORDERS_MESSAGING_RABBITMQ_PASSWORD=devpassword123
    ports:
      - "8083:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  checkout:
    image: public.ecr.aws/aws-containers/retail-store-sample-checkout:0.8.3
    hostname: checkout
    restart: always
    environment:
      - RETAIL_CHECKOUT_PERSISTENCE_PROVIDER=redis
      - RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL=redis://checkout-redis:6379
      - RETAIL_CHECKOUT_ENDPOINTS_ORDERS=http://orders:8080
    ports:
      - "8085:8080"
    depends_on:
      checkout-redis:
        condition: service_healthy

  ui:
    image: public.ecr.aws/aws-containers/retail-store-sample-ui:0.8.3
    hostname: ui
    restart: always
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - RETAIL_UI_ENDPOINTS_CATALOG=http://catalog:8080
      - RETAIL_UI_ENDPOINTS_CARTS=http://carts:8080
      - RETAIL_UI_ENDPOINTS_ORDERS=http://orders:8080
      - RETAIL_UI_ENDPOINTS_CHECKOUT=http://checkout:8080
    ports:
      - "8888:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      catalog:
        condition: service_started
      cart:
        condition: service_started
      orders:
        condition: service_started
      checkout:
        condition: service_started
